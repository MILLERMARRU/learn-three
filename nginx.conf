# ══ nginx para la SPA de Física 3D (Vite) ───────
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # compresión de JS, CSS y SVG
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # chequeo de salud para Docker/Dokploy
  location = /salud {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # archivos con hash en el nombre: caché de un año
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html siempre fresco para que se vean los despliegues nuevos
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # cualquier otra ruta cae en la app (usa rutas con #)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
