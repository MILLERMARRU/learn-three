# ══ Integración continua: tipos, lint, pruebas, build e imagen Docker en cada PR y en cada push a main ───────
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# si llega un push nuevo a la misma rama, se cancela la corrida anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, lint y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Build de producción
        run: npm run build

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verificar
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen (la misma que usa Dokploy)
        run: docker build -t learn-three:ci .
